<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Name Generator</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        canvas {
            margin-top: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h2>Enter Your Name</h2>
    <input type="text" id="nameInput" placeholder="Your Name">
    <button onclick="generateImage()">Generate</button>
    <br>
    <canvas id="imageCanvas"></canvas>
    <br>
    <a id="downloadLink" style="display: none;" download="customized_image.png">
        <button>Download</button>
    </a>

    <script>
        function generateImage() {
            const name = document.getElementById("nameInput").value;
            if (!name) {
                alert("Please enter your name.");
                return;
            }

            const imageUrl = "https://raw.githubusercontent.com/talaam2/Musharek-/61239844d3ddab41c63ce8e3dab799cd33efc2ef/IMG_3516.png"; 
            const canvas = document.getElementById("imageCanvas");
            const ctx = canvas.getContext("2d");
            const img = new Image();
            img.crossOrigin = "anonymous"; // Avoid CORS issues

            img.onload = function () {
                // Set canvas size to match image dimensions
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                // Set text properties
                ctx.font = "40px Arial"; // Adjusted text size
                ctx.fillStyle = "black";
                ctx.textAlign = "center";
                ctx.textBaseline = "top"; // Align text to the top

                // Calculate text position
                const textX = canvas.width / 2;
                const textY = canvas.height * 0.1; // Adjusted vertical position

                // Draw text on the image
                ctx.fillText(name, textX, textY);

                // Show the download button
                const downloadLink = document.getElementById("downloadLink");
                downloadLink.href = canvas.toDataURL("image/png");
                downloadLink.style.display = "inline";
            };

            img.onerror = function () {
                alert("Error loading image. Make sure the link is correct.");
            };

            img.src = imageUrl;
        }
    </script>

</body>
</html>
